# Runs one generator tick every 10 minutes against the deployed app.
# Enable it by adding two repository secrets (Settings -> Secrets and variables -> Actions):
#   APP_URL      e.g. https://walletops.vercel.app   (no trailing slash)
#   CRON_SECRET  the same value as the CRON_SECRET environment variable on Vercel
# GitHub may delay scheduled runs by a few minutes, and pauses schedules after 60 days without commits.
name: Generator tick

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run one tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets are not set - skipping."
            exit 0
          fi
          status=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/generator/tick")
          echo "tick endpoint answered HTTP $status"
          if [ "$status" -ge 400 ]; then exit 1; fi
